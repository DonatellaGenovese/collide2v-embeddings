name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/*", "dev"]

# Python 3.10 and 3.11 only: the code uses `dict | None` in annotations, which is 3.10,
# and the container is built from python:3.10-slim. The matrix used to include 3.8 and
# 3.9, where an import of src/ fails — nobody noticed, because pytest was not run.
#
# The tests that need a COLLIDE-2V dataset skip themselves when there is none, which
# there never is here, so the suite is meaningful on a runner: it covers the manifest,
# the loader, the event check, the column and feature-map checks, and a full
# vectorise-preprocess-read cycle on Parquet files the tests write themselves.

jobs:
  run_tests_ubuntu:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.10", "3.11"]

    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: List dependencies
        run: |
          python -m pip list

      - name: Run pytest
        run: |
          pytest -v

  run_tests_macos:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: ["macos-latest"]
        python-version: ["3.11"]

    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        run: |
          pytest -v

  # Windows is not part of what this repository supports: the pipeline is written for
  # lxplus and for Unix-like machines, and the batch submission is HTCondor shell
  # scripts. The job that used to install dependencies there and run nothing is gone.

  code-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pip install pytest-cov[toml]

      - name: Run tests and collect coverage
        run: pytest --cov src --cov-report=term-missing
