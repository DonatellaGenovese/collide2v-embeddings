# @package _global_
#
# A contrastive encoder on the dataset of fm_testing_binary: QCD against ggH->bb, the
# same `label`, so nothing has to be built again if that experiment was run first.
#
#   python src/train.py experiment=fm_testing_binary_contrastive                 # SimCLR
#   python src/train.py experiment=fm_testing_binary_contrastive model=supcon    # SupCon
#
# SimCLR and SupCon share this file because they only change the contrastive loss. What
# differs from a classifier is what a run is early stopped (see below)

defaults:
  # The same feature set as fm_testing_binary, which the dataset was built with.
  - override /data: collide2v_common
  # simclr or supcon, both in configs/model/; model=supcon on the command line picks
  # the other one.
  - override /model: simclr
  - override /callbacks: default
  - override /trainer: gpu

tags: ["collide2v", "contrastive", "binary"]

data:
  # The dataset of fm_testing_binary, unchanged: same events, same label.
  train_val_test_split_per_class: [50_000, 10_000, 10_000]
  label: "v3_binary_qcd_gghbb"
  to_classify:
    - "QCD_inclusive"
    - "ggHbb"

trainer:
  min_epochs: 1
  max_epochs: 50

callbacks:
  # The best checkpoint is fixed as the one with the lowest validation contrastive loss.
  model_checkpoint:
    monitor: "val/contrastive_loss"
    mode: "min"
  # Stops when the validation contrastive loss has not improved for `patience` epochs.
  #
  # The original papers did not do this: SimCLR (Chen et al., 2020) and SupCon (Khosla
  # et al., 2020) trained for a fixed number of epochs chosen in advance and evaluated
  # the encoder at the end, since a contrastive loss can keep falling slowly while the
  # embedding still improves. To train that way, switch it off and set the length:
  #
  #   python src/train.py experiment=fm_testing_binary_contrastive \
  #       callbacks.early_stopping=null trainer.max_epochs=<n>
  #
  # and probe last.ckpt rather than the best checkpoint.
  early_stopping:
    monitor: "val/contrastive_loss"
    mode: "min"
    min_delta: 0.0001
    patience: 10

preprocess:
  # As in fm_testing_binary: training reads the preprocessed shards.
  enabled: true

logger:
  mlflow:
    run_name: "binary_qcd_vs_gghbb_contrastive"
    experiment_name: "binary_contrastive"
