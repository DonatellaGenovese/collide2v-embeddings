# @package _global_
#
# The same 18 classes as fm_testing_18class_highlevel, with the nine extra variables
# that only the copy on EOS has — this is the feature set of the published study.
#
# Use it when you work on EOS and want those variables; use the plain
# fm_testing_18class_highlevel when you want an experiment that also runs on a Hugging
# Face download. The two write to different `label`s, so both can exist side by side.
#
#   python src/prepare_data.py experiment=fm_testing_18class_highlevel_eos
#   python src/train.py experiment=fm_testing_18class_highlevel_eos

defaults:
  - override /data: collide2v_extended_eos
  - override /callbacks: default
  - override /trainer: gpu

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["collide2v", "tinyTransformer", "18class", "eos_only"]

data:
  train_val_test_split_per_class: [1_000_000, 100_000, 100_000]
  label: "v3_18class_eos"
  to_classify:
    - "QCD_inclusive"
    - "DY_to_ll"
    - "Z_to_vv_jet"
    - "Z_to_qq_uds"
    - "Z_to_bb"
    - "Z_to_cc"
    - "W_to_lv"
    - "W_to_qq"
    - "gamma"
    - "QCD_bb"
    - "tt_all-hadr"
    - "tt_semi-lept"
    - "tt_all-lept"
    - "Minbias_Soft_QCD"
    - "Upsilon_to_Leptons"
    - "VBFHbb"
    - "HH_4b"
    - "ggHtautau"




trainer:
  min_epochs: 1
  max_epochs: 50
  gradient_clip_algorithm: norm
  gradient_clip_val: 1.0
  accumulate_grad_batches: 8


#callbacks:
#  early_stopping:
#    monitor: "val/acc"
#    min_delta: 0.0001
#    patience: 10


#model:
#  scheduler:
#    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
#    _partial_: true
#    patience: 2
#    factor: 0.5
#    min_lr: 1e-06
preprocess:
  enabled: true

logger:
  mlflow:
    run_name: "18_class_classification_sweep"
    experiment_name: "multi_class_classification"
