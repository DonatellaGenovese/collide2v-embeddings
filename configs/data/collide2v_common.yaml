# The 19 variables that exist in both copies of COLLIDE-2V, on EOS and on Hugging Face.
# Use this unless you need the ten that only EOS has: an experiment written against it
# runs on either copy, which is what makes a result reproducible by someone without a
# CERN account.
#
# The list was checked against a file downloaded from Hugging Face, which has 173 of the
# 271 columns the EOS copy has. `collide2v_extended_eos` adds the ten.
#
# Everything else — the processes, the splits, the seed, the preprocessing — is
# inherited from `collide2v_basic`.

defaults:
  - collide2v_basic

# The variables, grouped by object type. For each group:
#   cols   the Parquet columns to read, one variable each
#   topk   how many objects to keep: the k with the highest value of the first column
#          (pT here), in that order. An event with fewer gets zeros in the empty slots;
#          one with more loses the rest, so check that this does not cut into your signal.
#          null is for event-level quantities, such as MET, where there is nothing to sort.
#   count  true adds one column: how many objects the event had before truncation, so a
#          model can tell 12 jets from 20.
# A group gives topk x len(cols) columns, plus one if count is true. To use other
# variables, copy this file under a new name and select it in your experiment.
datasets_config:
  jets:
    cols:
      - FullReco_JetPuppiAK4_PT
      - FullReco_JetPuppiAK4_Eta
      - FullReco_JetPuppiAK4_Phi
      - FullReco_JetPuppiAK4_Mass
      - FullReco_JetPuppiAK4_BTag
    topk: 12
    count: true

  electrons:
    cols:
      - FullReco_Electron_PT
      - FullReco_Electron_Eta
      - FullReco_Electron_Phi
      - FullReco_Electron_EhadOverEem
      - FullReco_Electron_IsolationVarRhoCorr
    topk: 8
    count: false

  muons:
    cols:
      - FullReco_MuonTight_PT
      - FullReco_MuonTight_Eta
      - FullReco_MuonTight_Phi
      - FullReco_MuonTight_IsolationVarRhoCorr
    topk: 8
    count: false

  photons:
    cols:
      - FullReco_PhotonTight_PT
      - FullReco_PhotonTight_Eta
      - FullReco_PhotonTight_Phi
    topk: 8
    count: false

  puppi_met:
    cols:
      - FullReco_PUPPIMET_MET
      - FullReco_PUPPIMET_Phi
    topk: null   # scalar values
    count: false
