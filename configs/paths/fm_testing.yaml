# path to root directory
# this requires PROJECT_ROOT environment variable to exist
# you can replace it with "." if you want the root to be the current working directory
root_dir: ${oc.env:PROJECT_ROOT}

# Where the COLLIDE-2V Parquet files are read from. The default is the copy on EOS,
# readable from lxplus and from batch nodes. Off lxplus, point this at the files you
# downloaded from Hugging Face.
dataset_dir: ${oc.env:COLLIDE_DATASET_DIR,/eos/project/f/foundational-model-dataset/samples/production_final}

# Scratch space for vectorisation and preprocessing: shards are written here and then
# moved to `eos_data_dir`. On a batch node this should be local disk.
tmp_data_dir: ${oc.env:COLLIDE_TMP_DIR,${paths.root_dir}/data/tmp}

# Where the .npy shards end up and are read from during training. The name is
# historical: it does not have to be on EOS, and off lxplus it is simply a directory.
#
# Both default under the repository so that a small dataset works with no setup, and
# `data/` is already in .gitignore. A real dataset is hundreds of gigabytes and does
# not belong there: give it somewhere with room, either through these environment
# variables or, better, in configs/local/default.yaml, which Hydra loads if it exists
# and Git ignores. On lxplus that means /eos/user/<letter>/<user>/... , not an AFS
# home directory with a 10 GB quota.
eos_data_dir: ${oc.env:COLLIDE_DATA_DIR,${paths.root_dir}/data}

# path to logging directory
log_dir: ${paths.root_dir}/logs/

# path to output directory, created dynamically by hydra
# path generation pattern is specified in `configs/hydra/default.yaml`
# use it to store all files generated during the run, like ckpts and metrics
output_dir: ${hydra:runtime.output_dir}

# path to working directory
work_dir: ${hydra:runtime.cwd}
