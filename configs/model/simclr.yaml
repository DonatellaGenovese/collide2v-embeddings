# @package model
#
# SimCLR: the only positive of an augmented view is the other view of the same event.
# No labels are used, so this trains on data you have not labelled — which is the point
# of it. Labels are still read by the loader, and used here only for the diagnostic
# classification head and for the probes afterwards.
defaults:
  - _self_
  - scheduler: none

_target_: src.models.collide2v_contrastive.COLLIDE2VContrastiveLitModule

positives: views

# Encoder: same shape as tinyTransformer, so the two are comparable.
d_model: 512
n_heads: 8
num_layers: 6
d_ff: 2048
dropout: 0

projection_dim: 128
hidden_projection_dim: 256

# Low temperature puts the weight on the hardest negatives; 0.07 is what the published
# runs used, and what both SimCLR and SupCon papers report.
temperature: 0.07
base_temperature: 0.07

# Two views per event. More views means a larger effective batch and more memory.
num_views: 2

# How the two views of an event are made different. Two choices:
#
#   masking   RandomMaskingAugmentation, src/models/components/contrastive.py: sets
#             parts of the event to zero, as a detector that misses something would.
#               mask_probability     chance of dropping each slot, or each object
#               mask_full_particle   false drops single features, true whole objects
#
#   physics   PhysicsAugmentation, src/data/augmentations.py: transformations the
#             physics does not change, all three applied together:
#               phi_rotation   every object rotated by the same random angle in phi
#               eta_boost      every eta shifted by the same amount, ~ N(0, eta_sigma)
#               pt_smearing    pT smeared by a resolution, pt_sigma in log1p(pT) units
#             It acts on the normalised vectors and reads norm_stats.json to turn a
#             shift in physical units into one in normalised units, so it works only
#             on preprocessed data. The three cannot be switched off one by one
#             from here: the class has a flag for each, which the model does not pass.
#
# Empty slots stay empty in both: padding is never turned into an object.
augmentation: masking
mask_probability: 0.2
mask_full_particle: false
eta_sigma: 1.5
pt_sigma: 0.1

# A linear head on the embedding, to have an accuracy to watch while the contrastive
# loss falls. Its weight is small on purpose: it is a diagnostic, not the objective.
use_classification_head: true
classification_weight: 0.1

allow_single_class_batches: true
compile: false

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 2e-4
  weight_decay: 1e-2
  eps: 1e-09
  betas: [0.9, 0.999]
